name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build SPA
        working-directory: src/MonitorWay.UI/SPA
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          for project in MonitorWay.Core MonitorWay MonitorWay.UI MonitorWay.Mcp MonitorWay.Otlp; do
            dotnet build src/$project/$project.csproj \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.VERSION }}
          done

      - name: Pack
        run: |
          for project in MonitorWay.Core MonitorWay MonitorWay.UI MonitorWay.Mcp MonitorWay.Otlp; do
            dotnet pack src/$project/$project.csproj \
              --configuration Release --no-build \
              -p:Version=${{ steps.version.outputs.VERSION }} \
              --output ./nupkgs
          done

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
